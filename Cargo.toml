[package]
name = "discimage"
version = "0.4.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Enhanced CD authoring, outer-ring artwork and macOS recording"
repository = "https://github.com/shiftz300/discimage"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ctrlc = "3.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "0.8"

[build-dependencies]
cc = "1"

# Verbatim SW80EU1 · HL-DT-ST GX40N (RQ00)
# Copy these keys into the album's [disc] table. Keep the capacity and both
# radii together because they define the reference spiral.
# Confirmed visually on this disc after the corrected two-session burn.
# Requested write speed: 10x (burn --speed 10). This is separate from velocity.
# Measured Mode 1 start was LBA 120520. Measure it again on each burn.
#
# The previous burn drifted about 14 degrees from the inner to outer fiducial.
# The model correction is -0.82 degree/mm, anchored at radius 40.24394 mm.
# velocity adjusts the spiral mapping. angle preserves the inner alignment.
# Baseline spiral derived from the Verbatim 43480 preset in CDImage PR #29.
# https://github.com/arduinocelentano/cdimage/pull/29

[disc]
capacity_sectors = 359847
inner_radius_mm = 24.5
outer_radius_mm = 57.22749180512035
intertrack_gap_sectors = 150
session_reserve_sectors = 11400
data_reserve_sectors = 10000
end_margin_sectors = 150
velocity = 1183.177343317657
angle = 12.9100280418

<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CD 标定取点</title>
<style>
  body { margin: 0; color: #edf2fa; background: #151922; font: 16px system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 1; padding: 12px 20px; background: #232b3a; }
  h1 { font-size: 1.25rem; margin: 0 0 8px; }
  p { margin: 8px 0; }
  button, input { margin-right: 10px; }
  canvas { display: block; cursor: crosshair; margin: 12px; }
</style>
<header>
  <h1>CD 标定取点</h1>
  <p>使用从记录面垂直拍摄的完整 12 cm 盘片照片。沿同一条清楚的半径依次标出三条环带的内外边缘。</p>
  <p id="step" aria-live="polite">正在加载照片…</p>
  <label>缩放 <input id="zoom" type="range" min="0.25" max="2" step="0.05" value="0.5"></label>
  <button id="undo" disabled>撤销上一点</button>
  <button id="save" disabled>下载 points.json</button>
</header>
<canvas id="photo" aria-label="盘片照片"></canvas>
<script>
  const labels = [
    '实体外缘上方', '实体外缘右方', '实体外缘下方', '实体外缘左方',
    '中心孔上方', '中心孔右方', '中心孔下方', '中心孔左方',
    '第 1 带内缘', '第 1 带外缘', '第 2 带内缘', '第 2 带外缘',
    '第 3 带内缘', '第 3 带外缘',
  ];
  const canvas = document.getElementById('photo');
  const context = canvas.getContext('2d');
  const step = document.getElementById('step');
  const zoom = document.getElementById('zoom');
  const undo = document.getElementById('undo');
  const save = document.getElementById('save');
  const image = new Image();
  const points = [];

  function draw() {
    context.drawImage(image, 0, 0);
    const scale = 1 / Number(zoom.value);
    for (const [i, [x, y]] of points.entries()) {
      context.beginPath();
      context.arc(x, y, 4 * scale, 0, Math.PI * 2);
      context.fillStyle = i < 4 ? '#61e8f4' : i < 8 ? '#ffa65e' : '#a6f38a';
      context.fill();
      context.lineWidth = scale;
      context.strokeStyle = '#0d1320';
      context.stroke();
      context.font = `bold ${13 * scale}px sans-serif`;
      context.strokeText(String(i + 1), x + 6 * scale, y - 6 * scale);
      context.fillText(String(i + 1), x + 6 * scale, y - 6 * scale);
    }
    undo.disabled = points.length === 0;
    save.disabled = points.length !== labels.length;
    step.textContent = save.disabled
      ? `${points.length + 1}/${labels.length} · 点击${labels[points.length]}`
      : '取点完成，核对编号后下载。';
  }

  function resize() {
    canvas.style.width = `${canvas.width * Number(zoom.value)}px`;
    draw();
  }

  image.onload = () => {
    canvas.width = image.naturalWidth;
    canvas.height = image.naturalHeight;
    zoom.value = Math.min(1, Math.max(0.25, (innerWidth - 32) / canvas.width));
    resize();
  };
  canvas.addEventListener('click', event => {
    if (!canvas.width || !image.complete || points.length === labels.length) return;
    const box = canvas.getBoundingClientRect();
    points.push([
      (event.clientX - box.left) * canvas.width / box.width,
      (event.clientY - box.top) * canvas.height / box.height,
    ]);
    draw();
  });
  zoom.addEventListener('input', resize);
  undo.addEventListener('click', () => { points.pop(); draw(); });
  save.addEventListener('click', () => {
    const json = JSON.stringify({
      bundle_sha256: '@BUNDLE@', width: canvas.width, height: canvas.height,
      rim: points.slice(0, 4), hole: points.slice(4, 8), edges: points.slice(8),
    }, null, 2);
    const url = URL.createObjectURL(new Blob([json], {type: 'application/json'}));
    const link = document.createElement('a');
    link.href = url;
    link.download = 'points.json';
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
  image.src = 'data:image/png;base64,@PHOTO@';
</script>
</html>
